openapi: 3.1.0
info:
  title: QTS Portal API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Hợp đồng API nền tảng và xác thực của QTS Portal. Google OpenID Connect chạy
    hoàn toàn qua backend; frontend chỉ sử dụng session cookie cùng origin và
    không nhận Google token.
servers:
  - url: http://127.0.0.1:8080
    description: Môi trường phát triển local
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Kiểm tra tiến trình API đang hoạt động
      tags: [Infrastructure]
      security: []
      responses:
        "200":
          description: Tiến trình API đang hoạt động
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/ready:
    get:
      operationId: getReadiness
      summary: Kiểm tra API sẵn sàng nhận lưu lượng
      tags: [Infrastructure]
      security: []
      responses:
        "200":
          description: API sẵn sàng nhận lưu lượng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: API hoặc dependency chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: Kiểm tra Google OIDC đã được cấu hình hay chưa
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: Trạng thái cấu hình đăng nhập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/auth/login/google:
    get:
      operationId: startGoogleLogin
      summary: Bắt đầu Authorization Code Flow với Google
      description: >-
        Backend tạo state, nonce và PKCE S256 mới cho từng giao dịch, lưu dữ liệu
        giao dịch phía server rồi chuyển trình duyệt đến Google.
      tags: [Authentication]
      security: []
      parameters:
        - in: query
          name: returnTo
          required: false
          schema:
            type: string
            maxLength: 2048
            default: "/"
          description: Đường dẫn cùng origin sẽ mở sau khi xác thực thành công
      responses:
        "302":
          description: Chuyển đến Google Authorization Endpoint
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              schema:
                type: string
              description: Cookie giao dịch HttpOnly, SameSite=Lax và Secure ở HTTPS
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Vượt giới hạn bắt đầu phiên đăng nhập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/auth/callback/google:
    get:
      operationId: completeGoogleLogin
      summary: Nhận callback OpenID Connect từ Google tại backend
      description: >-
        Backend kiểm tra state, PKCE, chữ ký ID token, issuer, audience, expiry,
        nonce, email_verified và hosted-domain (nếu cấu hình), sau đó ánh xạ
        người dùng bằng cặp iss + sub.
      tags: [Authentication]
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Tạo session và chuyển đến workspace được cấp quyền
          headers:
            Location:
              required: true
              schema:
                type: string
            Set-Cookie:
              required: true
              schema:
                type: string
              description: Session cookie opaque, HttpOnly, SameSite=Lax và Secure ở HTTPS
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Lấy phiên QTS hiện tại
      tags: [Authentication]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Phiên còn hiệu lực
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Thu hồi session QTS hiện tại
      tags: [Authentication]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session đã bị thu hồi và cookie đã được xóa
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/v1/contact-requests:
    post:
      operationId: createContactRequest
      summary: Gửi yêu cầu tư vấn từ trang công ty
      tags: [Public intake]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequestInput"
      responses:
        "201":
          description: Yêu cầu đã được lưu để đội ngũ QTS tiếp nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          description: Nội dung yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Vượt giới hạn gửi yêu cầu theo địa chỉ nguồn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/portal/invitations:
    get:
      operationId: listInvitations
      summary: Liệt kê lời mời trong tenant/workspace được cấp quyền
      tags: [Membership]
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
          description: Chỉ dành cho workspace nội bộ; client luôn dùng tenant trong session
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
      responses:
        "200":
          description: Danh sách lời mời; bản ghi quá hạn được chuyển thành EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInvitation
      summary: Tạo lời mời gắn trước tenant và role
      tags: [Membership]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateInput"
      responses:
        "201":
          description: Lời mời đã được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Email, role hoặc thời hạn không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/portal/invitations/{id}:
    patch:
      operationId: revokeInvitation
      summary: Thu hồi lời mời đang chờ
      tags: [Membership]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationPatchInput"
      responses:
        "200":
          description: Lời mời đã được thu hồi và ghi audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Không tìm thấy lời mời trong tenant scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version xung đột hoặc lời mời không còn ở trạng thái PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-qts_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    BadRequest:
      description: Tham số hoặc giao dịch đăng nhập không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Chưa có session hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Danh tính không được cấp quyền hoặc yêu cầu CSRF không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc chưa được cấu hình hoặc tạm thời không khả dụng
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: Phương thức HTTP không được hỗ trợ
      headers:
        Allow:
          schema:
            type: string
          description: Danh sách phương thức được hỗ trợ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [service, status, version]
          properties:
            service:
              type: string
              const: qts-portal-api
            status:
              type: string
              const: ok
            version:
              type: string
              examples: [1.0.0]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              const: ready
    AuthStatusResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [configured, provider]
          properties:
            configured:
              type: boolean
            provider:
              type: string
              const: google
    SessionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user, authorization, csrfToken, expiresAt]
          properties:
            user:
              type: object
              additionalProperties: false
              required: [email, displayName]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
            authorization:
              type: object
              additionalProperties: false
              required: [tenantId, role, workspace]
              properties:
                tenantId:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
                workspace:
                  type: string
                  enum: [client, internal]
            csrfToken:
              type: string
            expiresAt:
              type: string
              format: date-time
    ContactRequestInput:
      type: object
      additionalProperties: false
      required: [name, phone, email, company, service, message, consent]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        phone:
          type: string
          minLength: 8
          maxLength: 32
          pattern: '^[+0-9(). -]+$'
        email:
          type: string
          format: email
          maxLength: 254
        company:
          type: string
          minLength: 2
          maxLength: 160
        service:
          type: string
          enum:
            - website-design
            - software-development
            - digital-transformation
            - online-advertising
            - digital-marketing
            - it-solutions
        message:
          type: string
          minLength: 20
          maxLength: 1200
        consent:
          type: boolean
          const: true
    ContactRequestResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, status, createdAt]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              const: NEW
            createdAt:
              type: string
              format: date-time
    InvitationCreateInput:
      type: object
      additionalProperties: false
      required: [email, role, expiresAt]
      properties:
        tenantId:
          type: string
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          type: string
          format: date-time
          description: Phải nằm trong 30 ngày tiếp theo
    InvitationPatchInput:
      type: object
      additionalProperties: false
      required: [status, expectedVersion]
      properties:
        status:
          type: string
          const: REVOKED
        expectedVersion:
          type: integer
          minimum: 1
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - email
        - role
        - workspace
        - status
        - version
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        tenantName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        workspace:
          type: string
          enum: [client, internal]
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        version:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InvitationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Invitation"
    InvitationCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        pagination:
          type: object
          additionalProperties: false
          required: [page, pageSize, totalItems, totalPages]
          properties:
            page:
              type: integer
              minimum: 1
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
            totalItems:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0
    Role:
      type: string
      enum:
        - client_admin
        - client_viewer
        - billing
        - technical
        - soc_l1
        - soc_l2
        - soc_l3
        - account_manager
        - qts_admin
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
